name: Renovate Slack Notify
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check automerge label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # RenovateはPR作成の直後に別APIでラベルを付けるため、少し待ってから取り直す
          notify=true
          for _ in 1 2 3 4; do
            sleep 15
            if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'automerge'; then
              notify=false
              break
            fi
          done
          echo "notify=$notify" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.check.outputs.notify == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "手動マージが必要なRenovate PR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}>"
