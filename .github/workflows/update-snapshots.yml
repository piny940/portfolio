name: Update Snapshots
on:
  pull_request:

jobs:
  update-snapshots:
    if: github.head_ref == 'renovate/playwright' && github.actor == 'renovate[bot]'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEPLOYER_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: "package.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm exec playwright test --update-snapshots
      - name: Commit and push snapshots
        run: |
          if [ -z "$(git status --porcelain -- __tests__/e2e)" ]; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "deployer-piny940[bot]"
          git config user.email "203525814+deployer-piny940[bot]@users.noreply.github.com"
          git add __tests__/e2e
          git commit -m "Update snapshots"
          git push
